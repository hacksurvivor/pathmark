name: Publish to MCP Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already published to npm
        required: true
        type: string
      confirmation:
        description: Type PUBLISH io.github.hacksurvivor/pathmark
        required: true
        type: string

concurrency:
  group: publish-mcp-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate publication request
        env:
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be strict SemVer without a leading v" >&2
            exit 1
          fi
          if [[ "$CONFIRMATION" != "PUBLISH io.github.hacksurvivor/pathmark" ]]; then
            echo "Exact publication confirmation is required" >&2
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm

      - name: Verify release metadata
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm ci
          npm run release:verify -- --tag="v$VERSION"
          npm pack --dry-run

      - name: Verify published npm package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm view "pathmark@$VERSION" name version mcpName --json > npm-package.json
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";

          const expectedVersion = process.env.VERSION;
          const metadata = JSON.parse(await readFile("npm-package.json", "utf8"));
          assert.equal(metadata.name, "pathmark");
          assert.equal(metadata.version, expectedVersion);
          assert.equal(metadata.mcpName, "io.github.hacksurvivor/pathmark");
          NODE

      - name: Validate with MCP Registry
        run: |
          curl --fail-with-body \
            --header "Content-Type: application/json" \
            --data-binary @server.json \
            --output registry-validation.json \
            https://registry.modelcontextprotocol.io/v0.1/validate
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";

          const result = JSON.parse(await readFile("registry-validation.json", "utf8"));
          assert.equal(result.valid, true, JSON.stringify(result.issues));
          NODE

      - name: Install verified MCP publisher
        env:
          MCP_PUBLISHER_VERSION: "1.8.0"
          MCP_PUBLISHER_SHA256: "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf"
        run: |
          curl --fail-with-body --location \
            --output mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --help

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

      - name: Verify Registry record
        run: |
          curl --fail-with-body \
            --get \
            --data-urlencode "search=io.github.hacksurvivor/pathmark" \
            --output registry-record.json \
            https://registry.modelcontextprotocol.io/v0.1/servers
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";

          const response = JSON.parse(await readFile("registry-record.json", "utf8"));
          const match = response.servers?.find(
            (entry) =>
              entry.server?.name === "io.github.hacksurvivor/pathmark" &&
              entry.server?.version === process.env.VERSION,
          );
          assert.ok(match, "Published Registry version was not found");
          NODE
        env:
          VERSION: ${{ inputs.version }}
